<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="player.css">
    <title>NUMSIL DEMO PLAYER</title>
</head>
<body>
    <audio id="audioSource"></audio>
    <div class="playerBackground">
    
       

        <div class="playerBody">
            <div class="playerBlur"></div>
            <div class="playerLayout">
                <div class="rotateCD">
                </div>
                <div class="rotateCDShadow">
                </div>
                <div class="rotateCDdec">
                </div>
                <div class="rotateCDdecBlur">
                </div>
                <div class="songTitle">
                    
                </div>

                <div class="songCredit">
                    
                </div>

                <div class="buttonGroup">

                    <div class="prevbutton">
                        <div class="prevText">Prev</div>
                        <div class="prevLogo">▲</div>
                    </div>
                    <div class="pausebutton" >
                        
                    </div>
                    <div class="nextbutton">
                        <div class="nextLogo">▼</div>
                        <div class="nextText">Next</div>
                    </div>

                </div>
                

            </div>
        </div>

        

    </div>

</body>

<script src="player.js">
    
</script>

</html>
